name: VK Sync

# Автосинхронизация постов из группы ВК в src/data/fund.json.
# По расписанию (4 слота в день) и вручную (Actions -> VK Sync -> Run workflow).
# Новые посты дописываются в fund.json, фото — в public/images.
# Деплой на Vercel происходит автоматически после пуша.
# NB: GitHub задерживает и иногда пропускает cron-слоты на ровных часах,
# поэтому слоты не на «круглых» значениях и их несколько — пропуск одного не страшен.

on:
  schedule:
    # 01:23 / 07:23 / 13:23 / 19:23 UTC = 04:23 / 10:23 / 16:23 / 22:23 МСК
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright requests pillow
          python -m playwright install --with-deps chromium

      - name: Run VK sync
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/ci_vk_sync.py

      - name: Run VK albums sync
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/vk_albums_sync.py all

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "VK sync: новые посты из группы (авто)"
            git push
          fi
